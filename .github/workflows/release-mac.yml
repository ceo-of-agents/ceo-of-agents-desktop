# Mac release (internal use): builds the ad-hoc signed app and the unsigned .dmg with `npm run package:mac`.
# A pushed tag vX.Y.Z (must equal package.json "version") builds and publishes a GitHub Release with the .dmg.
# A manual run (workflow_dispatch) only builds: the .dmg is a workflow artifact, nothing is published.
# macOS minutes count against the account's Actions quota: no push or pull_request triggers on purpose.
name: Mac release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the .dmg
    runs-on: macos-26 # Apple Silicon (arm64)
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Read the version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Check that the tag matches package.json
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION (expected v$VERSION)."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Fetch the Electron binary
        run: test -d node_modules/electron/dist/Electron.app || node node_modules/electron/install.js
      - name: Lint and test
        run: npm run check
      - name: Package the app and the .dmg
        run: npm run package:mac
      - name: Give the .dmg a name without spaces
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: mv "out/CEO of Agents-$VERSION.dmg" "out/CEO-of-Agents-$VERSION.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CEO-of-Agents-${{ steps.version.outputs.version }}-dmg
          path: out/CEO-of-Agents-${{ steps.version.outputs.version }}.dmg
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest # only downloads the artifact and calls gh: no macOS minutes
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: CEO-of-Agents-${{ needs.build.outputs.version }}-dmg
          path: release
      - name: Create the release with the .dmg
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          gh release create "$TAG" "release/CEO-of-Agents-$VERSION.dmg"
          --repo "$GITHUB_REPOSITORY"
          --title "CEO of Agents $VERSION"
          --generate-notes
          --verify-tag
